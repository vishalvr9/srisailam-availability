name: Check Sparsha availability

on:
  workflow_dispatch:
  schedule:
    - cron: "7-57/10 * * * *"

permissions:
  contents: read

concurrency:
  group: sparsha-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Test temple connectivity
        shell: bash
        run: |
          failed=0
          for family in 4 6; do
            echo "Testing IPv${family}"
            if curl "-${family}" --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --output /dev/null \
              --write-out 'HTTP %{http_code}; remote IP %{remote_ip}; total %{time_total}s\n' \
              https://tms.ap.gov.in/; then
              echo "IPv${family}: HTTP response received"
            else
              echo "IPv${family}: connection failed"
              failed=1
            fi
          done
          exit "$failed"

      - name: Check 14 November 2026
        shell: pwsh
        run: |
          $cutoff = [DateTimeOffset]::Parse("2026-11-15T00:00:00+05:30")
          if ([DateTimeOffset]::UtcNow -ge $cutoff) {
            Write-Output "Target date has passed; skipping availability checks."
            exit 0
          }

          & ./check-sparsha.ps1 -Date "2026-11-14"
